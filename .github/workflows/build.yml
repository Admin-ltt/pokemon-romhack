name: Build ROM

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 g++ git

      - name: Verify required source files
        run: |
          test -f Makefile
          test -f tools/compresSmol/Makefile
          test -f tools/compresSmol/compresSmol.cpp
          test -f tools/compresSmol/compresSmolTilemap
          test -f tools/compresSmol/compressSmolTiles.cpp
          echo "Required Expansion sources are present."

      - name: Clean generated files
        run: make clean-tools || true

      - name: Build Emerald release
        env:
          GAME_VERSION: EMERALD
          CXX: g++
          CC: gcc
        run: make -j2 -O release

      - name: Verify ROM
        run: |
          test -f pokeemerald-release.gba
          ls -lh pokeemerald-release.gba

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-romhack-v2
          path: pokeemerald-release.gba
          if-no-files-found: error
